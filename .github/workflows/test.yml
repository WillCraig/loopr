name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: Update visual screenshot baselines
        type: boolean
        default: false

jobs:
  functional:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable pnpm via corepack
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      - name: Type and lint checks
        run: pnpm verify

      - run: pnpm test:unit -- --run

      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(pnpm exec playwright --version | awk '{print $NF}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
          restore-keys: playwright-${{ runner.os }}-

      - name: Install Playwright browsers
        timeout-minutes: 10
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Cross-browser functional and accessibility tests
        run: pnpm test:e2e:functional

      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-functional-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  visual:
    # Visual baselines are Linux renders. Run on ubuntu-latest, never a
    # GitHub-hosted macos-* runner and never the self-hosted Mac.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable pnpm via corepack
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(pnpm exec playwright --version | awk '{print $NF}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
          restore-keys: playwright-${{ runner.os }}-

      - name: Install visual-test browsers
        timeout-minutes: 10
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      # Temporary: always refresh baselines on this commit so we can download
      # Linux screenshots that match ubuntu-latest. The follow-up commit
      # switches this job back to compare-only.
      - name: Update visual screenshot baselines
        run: pnpm test:visual:update

      - name: Upload updated screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: updated-screenshots
          path: tests/e2e/__screenshots__/
          retention-days: 3

      - name: Upload visual diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-visual-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
