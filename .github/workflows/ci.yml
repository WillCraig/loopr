name: ci

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5

      - name: Cache Bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run check

      - name: Unit tests
        run: bun run test:unit -- --run

      - name: Production build
        run: bun run build

      # Preview, lychee, and Lighthouse share one step so the server
      # is not killed between GitHub Actions steps.
      - name: Preview, link check, and Lighthouse
        run: |
          bun run preview --host 127.0.0.1 --port 4173 > /tmp/loopr-preview.log 2>&1 &
          ready=0
          for _ in $(seq 1 40); do
            if curl -sf -o /dev/null http://127.0.0.1:4173/loopr/; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then
            cat /tmp/loopr-preview.log
            exit 1
          fi
          case "$(uname -m)" in
            aarch64|arm64) asset=lychee-aarch64-unknown-linux-gnu.tar.gz ;;
            *) asset=lychee-x86_64-unknown-linux-gnu.tar.gz ;;
          esac
          curl -fsSL -o /tmp/lychee.tar.gz \
            "https://github.com/lycheeverse/lychee/releases/download/lychee-v0.24.2/${asset}"
          mkdir -p /tmp/lychee-bin
          tar -xzf /tmp/lychee.tar.gz -C /tmp/lychee-bin --strip-components=1
          /tmp/lychee-bin/lychee --verbose --no-progress --max-retries 2 --timeout 20 \
            --exclude '^https://' \
            http://127.0.0.1:4173/loopr/ \
            http://127.0.0.1:4173/loopr/robots.txt \
            http://127.0.0.1:4173/loopr/sitemap.xml
          bunx --yes @lhci/cli@0.15.1 autorun

      - name: Upload Lighthouse results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse
          path: .lighthouseci
          if-no-files-found: ignore
          retention-days: 14
