<!doctype html>
<html lang="en" data-theme="clay" data-density="regular" data-radius="soft">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<script>
			// Honour prefers-color-scheme on first paint. No UI toggle in v1;
			// the route-workshop palette follows the rider's system setting.
			try {
				if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
					document.documentElement.setAttribute('data-dark', '1');
				}
			} catch {
				/* no-op — older browsers fall back to light. */
			}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
