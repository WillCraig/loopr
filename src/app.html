<!doctype html>
<html lang="en" data-theme="clay" data-density="regular" data-radius="soft">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta
			name="description"
			content="Free GPX loop repeater for cyclists, triathlon bike legs, and crit race courses. Drop a GPX of one circuit, set laps or a distance target, download a stitched GPX for Garmin, Wahoo, or Strava. Runs in your browser."
		/>
		<script type="application/ld+json">
			{
				"@context": "https://schema.org",
				"@type": "WebApplication",
				"name": "loopr",
				"url": "https://loopr.willcsoftware.com",
				"applicationCategory": "SportApplication",
				"operatingSystem": "Any",
				"offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
				"description": "Free GPX loop repeater for cyclists, triathletes, and crit race organizers.",
				"featureList": [
					"GPX loop and lap repeater",
					"Criterium race course builder",
					"Triathlon bike leg route planner",
					"Endurance athlete GPX tool",
					"Garmin Connect compatible",
					"Wahoo ELEMNT compatible",
					"Strava import support",
					"Privacy-first — files never leave your browser"
				]
			}
		</script>
		<link rel="icon" href="%sveltekit.assets%/favicon.ico" sizes="32x32" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
		<link rel="manifest" href="%sveltekit.assets%/site.webmanifest" />
		<meta name="theme-color" content="#ece5d3" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#15130f" media="(prefers-color-scheme: dark)" />
		<script>
			// Honour prefers-color-scheme on first paint. No UI toggle in v1;
			// the route-workshop palette follows the rider's system setting.
			try {
				if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
					document.documentElement.setAttribute('data-dark', '1');
				}
			} catch {
				/* no-op — older browsers fall back to light. */
			}
		</script>
		%sveltekit.head%
		<!-- GoatCounter analytics (cookieless) — the one config spot is the
		     data-goatcounter URL below.
		     TODO(Will): confirm "willcraig" is the right GoatCounter site
		     code and that counts arrive for production traffic (see #5);
		     swap the subdomain here if not. Skipped on localhost / preview
		     hosts so dev traffic is never counted. -->
		<script>
			if (
				!['localhost', '127.0.0.1', '[::1]', ''].includes(location.hostname) &&
				!location.hostname.endsWith('.local')
			) {
				var gc = document.createElement('script');
				gc.async = true;
				gc.src = '//gc.zgo.at/count.js';
				gc.dataset.goatcounter = 'https://willcraig.goatcounter.com/count';
				document.head.appendChild(gc);
			}
		</script>
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
